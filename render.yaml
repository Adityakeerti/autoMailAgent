services:
  - type: web
    name: automail-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://getyourjob-e9dn.onrender.com/auth/google/callback
      - key: FRONTEND_URL
        value: https://getnewjob-ai.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://getnewjob-ai.vercel.app,https://getyourjob-e9dn.onrender.com
